name: Build & Package Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper Executable
        run: |
          chmod +x gradlew || true

      - name: Run Unit Tests (Robolectric & JUnit)
        run: |
          gradle testDebugUnitTest --continue || ./gradlew testDebugUnitTest --continue || true
        continue-on-error: true

      - name: Build Android App Bundle (.AAB for Google Play Store)
        run: |
          gradle :app:bundleRelease -x test || gradle :app:bundleDebug -x test || ./gradlew :app:bundleRelease -x test || ./gradlew :app:bundleDebug -x test

      - name: Build Installable Universal APK (.APK for Mobile Device)
        run: |
          gradle :app:assembleRelease -x test || gradle :app:assembleDebug -x test || ./gradlew :app:assembleRelease -x test || ./gradlew :app:assembleDebug -x test

      - name: Sign Android App Bundle (if Keystore Secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: "${{ env.KEYSTORE_BASE64 != '' }}"
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayStore-Release-AAB
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Installable-Release-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
