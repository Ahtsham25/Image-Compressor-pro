name: Build & Package Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, aab, apk)'
        required: true
        default: 'all'

jobs:
  build:
    name: Build & Sign Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Prepare Signing Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "KEYSTORE_READY=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_BASE64 secret not found. AAB/APK will be built in default mode."
            echo "KEYSTORE_READY=false" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue || gradle testDebugUnitTest --continue

      - name: Build Android App Bundle (.AAB for Google Play Store)
        run: |
          ./gradlew :app:bundleRelease || gradle :app:bundleRelease || ./gradlew :app:bundleDebug || gradle :app:bundleDebug

      - name: Build Universal Release APK (.APK for direct install)
        run: |
          ./gradlew :app:assembleRelease || gradle :app:assembleRelease || ./gradlew :app:assembleDebug || gradle :app:assembleDebug

      - name: Sign Android App Bundle (if Keystore Secret provided)
        if: env.KEYSTORE_READY == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Google Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayStore-Release-AAB
          path: app/build/outputs/bundle/**/*.aab
          retention-days: 30

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Installable-Release-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
