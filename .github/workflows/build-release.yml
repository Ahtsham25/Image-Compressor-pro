name: Build & Package Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug & Release Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 1. Restore debug.keystore from debug.keystore.base64
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore"
          fi

          # 2. Prepare my-upload-key.jks for release signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore provided via GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            echo "Generating fallback upload keystore for release build"
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -keypass android -alias upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Developer, OU=App, O=AIStudio, L=City, ST=State, C=US"
          fi

      - name: Build Android App Bundle (.AAB for Google Play Store)
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          gradle :app:bundleRelease

      - name: Build Installable Universal APK (.APK for Mobile Device)
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          gradle :app:assembleRelease

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayStore-Release-AAB
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Installable-Release-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
